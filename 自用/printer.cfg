#####################################################################
#                           自定义gcode宏                            #
#####################################################################
[gcode_macro PRINT_START]          # 将 PRINT_START 设置为开始打印时的宏,自定义打印前的动作
gcode:
    G92 E0                         # 重置挤出
    BED_MESH_CLEAR                 # 卸载网床
    G28                            # 归位所有轴
    quad_gantry_level              # 龙门架调平
    G28
    G1 Z20 F3000                   # 将喷嘴移离热床
    PROBE_CALIBRATE METHOD=AUTO    #自动 Z 偏移测量
    BED_MESH_PROFILE LOAD=default  # 加载网床


[gcode_macro PRINT_END]            # 将 PRINT_END 设置为打印结束时的宏,自定义打印完成之后动作
gcode:
    #   Get Boundaries
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
    
    #   Check end position to determine safe directions to move
    {% if printer.toolhead.position.x < (max_x - 20) %}
        {% set x_safe = 20.0 %}
    {% else %}
        {% set x_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.y < (max_y - 20) %}
        {% set y_safe = 20.0 %}
    {% else %}
        {% set y_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.z < (max_z - 2) %}
        {% set z_safe = 2.0 %}
    {% else %}
        {% set z_safe = max_z - printer.toolhead.position.z %}
    {% endif %}

    M400                              # 等待缓冲区清除
    G92 E0                            # 将挤出机归零
    G1 E-10.0 F3600                   # 缩回耗材丝
    G91                               # 相对定位
    G0 Z{z_safe} F3600                # 抬高龙门
    G0 X{x_safe} Y{y_safe} F20000     # 移动喷嘴以移除料线
    M104 S0                           # 关闭挤出头
    M140 S0                           # 关闭热床
    M106 S0                           # 关闭模型风扇
    G90                               # 设置绝对坐标体系
    G0 X{max_x / 2} Y{max_y} F3600    # 将喷嘴停在后部
    BED_MESH_CLEAR                    # 卸载网床



[gcode_arcs]                       # 允许圆弧插补
resolution: 1.0                    # 启用圆弧插补G2，G3

[gcode_macro G32]
gcode:
    BED_MESH_CLEAR                 # 卸载网床
    #STATUS_HOMING
    status_homing
    G28                            # 归位所有轴
    #STATUS_CALIBRATING_Z
    #LED_onprobe
    status_calibrating_z
    QUAD_GANTRY_LEVEL              # 龙门架调平
    #STATUS_LEVELING
    #G0 X125 Y125 Z30 F3600        # 250mm
    G0 X150 Y150 Z30 F3600        # 300mm
    #G0 X175 Y175 Z30 F3600        # 350mm
    status_ready

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    SAVE_GCODE_STATE NAME=STATE_QGL
    BED_MESH_CLEAR
    {% if not printer.quad_gantry_level.applied %}
      _QUAD_GANTRY_LEVEL horizontal_move_z=10 retry_tolerance=1
    {% endif %}
    _QUAD_GANTRY_LEVEL horizontal_move_z=2
    RESTORE_GCODE_STATE NAME=STATE_QGL

# 	归位自定义
#####################################################################
# [homing_override]
# axes: xyz
# gcode:
#     {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
#     {% if home_all or 'Y' in params or 'X' in params %}
#         G28 Y
#     {% endif %}
#     {% if home_all or 'X' in params %}
#         G28 X
#     {% endif %}
#     {% if home_all or 'Z' in params %}
#            G90
#       G1 X140 Y140 F6000
#         G28 Z 
#         G1 Z10 F3000
#     {% endif %}
    
[homing_override]
axes: z
set_position_z: 0
gcode:
  G90
  G0 Z15 F600

  # 如果X未归位 → 执行Y归零
  {% if 'x' not in printer.toolhead.homed_axes %}
    G28 Y
  {% endif %}
  # 如果Y未归位 → 执行X归零
  {% if 'y' not in printer.toolhead.homed_axes %}
    G28 X
  {% endif %}

  ## Z探针执行位置 X185 Y250
  G0 X150 Y150 F25000
  G28 Z
  G0 Z10 F1800

[gcode_macro DATA_SAMPLE]
gcode:
  {% set bed_temp = params.BED_TEMP|default(90)|int %}
  {% set nozzle_temp = params.NOZZLE_TEMP|default(250)|int %}
  {% set min_temp = params.MIN_TEMP|default(40)|int %}
  {% set max_temp = params.MAX_TEMP|default(70)|int %}
  M106 S255
  TEMPERATURE_WAIT SENSOR='temperature_sensor IDM_coil' MAXIMUM={min_temp}
  M106 S0
  G28
  G0 Z1
  M104 S{nozzle_temp}
  M140 S{bed_temp}
  TEMPERATURE_WAIT SENSOR='temperature_sensor IDM_coil' MINIMUM={min_temp}
  IDM_STREAM FILENAME=/tmp/data1
  TEMPERATURE_WAIT SENSOR='temperature_sensor IDM_coil' MINIMUM={max_temp}
  IDM_STREAM FILENAME=/tmp/data1
  M104 S0
  M140 S0
  M106 S255
  G0 Z80
  TEMPERATURE_WAIT SENSOR='temperature_sensor IDM_coil' MAXIMUM={min_temp}
  M106 S0
  G28 Z0
  G0 Z2
  M104 S{nozzle_temp}
  M140 S{bed_temp}
  G4 P1000
  IDM_STREAM FILENAME=/tmp/data2
  TEMPERATURE_WAIT SENSOR='temperature_sensor IDM_coil' MINIMUM={max_temp}
  IDM_STREAM FILENAME=/tmp/data2
  M104 S0
  M140 S0
  M106 S255
  G0 Z80
  TEMPERATURE_WAIT SENSOR='temperature_sensor IDM_coil' MAXIMUM={min_temp}
  M106 S0
  G28 Z0
  G0 Z3
  M104 S{nozzle_temp}
  M140 S{bed_temp}
  G4 P1000
  IDM_STREAM FILENAME=/tmp/data3
  TEMPERATURE_WAIT SENSOR='temperature_sensor IDM_coil' MINIMUM={max_temp}
  IDM_STREAM FILENAME=/tmp/data3
  M104 S0
  M140 S0

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE
gcode:
    {% set TARGET_TEMP = printer.heater_bed.target %}
    M140 S0
    _BED_MESH_CALIBRATE {rawparams}
    M140 S{TARGET_TEMP}

