[include mcu/AFC_Lite.cfg]

[mcu MCB_V3]
#canbus_uuid: <replace with your can UUID>
serial: /dev/serial/by-id/usb-Klipper_stm32f072xb_470040000F53585932353320-if00

[temperature_sensor MMU_enclosure]
sensor_type: AHT2X
i2c_mcu: MCB_V3
i2c_bus: i2c1_PB6_PB7
i2c_address: 56

[neopixel MCBV3_LIGHT]
pin: MCB_V3:PA14
chain_count: 22
color_order: GRB
initial_RED: 1
initial_GREEN: 1
initial_BLUE: 1

[AFC_BoxTurtle MCB_V3]
hub: MCB_V3
extruder: extruder
enable_assist: True        # Setting to True enables espooler assist while printing
enable_kick_start: True    # Setting to True enables full speed espoolers for kick_start_time(0.070 ms default) amount
# buffer: <buffer_name> # If not defined below from the install script, uncomment and add buffer name if using a buffer
buffer: MCB_V3

[temperature_sensor MCB_V3]
sensor_type: temperature_mcu
sensor_mcu: MCB_V3

[AFC_stepper lane1]
unit: MCB_V3:1
step_pin: MCB_V3:M1_STEP
dir_pin: MCB_V3:M1_DIR
enable_pin: !MCB_V3:M1_EN
microsteps: 16
rotation_distance: 7.905
dist_hub: 155.0
park_dist: 10
led_index: AFC_Indicator:4
# afc_motor_rwd: MCB_V3:MOT1_RWD
# afc_motor_fwd: MCB_V3:MOT1_FWD
# afc_motor_enb: MCB_V3:MOT1_EN
# rwd_speed_multiplier: 0.5
# fwd_speed_multiplier: 0.5
# pwm: True
# hardware_pwm: True
prep: ^!MCB_V3:TRG1
load: ^MCB_V3:EXT1

[tmc2209 AFC_stepper lane1]
uart_pin: MCB_V3:M1_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_stepper lane2]
unit: MCB_V3:2
step_pin: MCB_V3:M2_STEP
dir_pin: MCB_V3:M2_DIR
enable_pin: !MCB_V3:M2_EN
microsteps: 16
rotation_distance: 7.905
dist_hub: 210
park_dist: 10
led_index: AFC_Indicator:3
# afc_motor_rwd: MCB_V3:MOT2_RWD
# afc_motor_fwd: MCB_V3:MOT2_FWD
# afc_motor_enb: MCB_V3:MOT2_EN
# rwd_speed_multiplier: 0.5
# fwd_speed_multiplier: 0.5
# pwm: True
# hardware_pwm: True
prep: ^!MCB_V3:TRG2
load: ^MCB_V3:EXT2

[tmc2209 AFC_stepper lane2]
uart_pin: MCB_V3:M2_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_stepper lane3]
unit: MCB_V3:3
step_pin: MCB_V3:M3_STEP
dir_pin: MCB_V3:M3_DIR
enable_pin: !MCB_V3:M3_EN
microsteps: 16
rotation_distance: 7.905
dist_hub: 305
park_dist: 10
led_index: AFC_Indicator:2
# afc_motor_rwd: MCB_V3:MOT3_RWD
# afc_motor_fwd: MCB_V3:MOT3_FWD
# afc_motor_enb: MCB_V3:MOT3_EN
# rwd_speed_multiplier: 0.5
# fwd_speed_multiplier: 0.5
# pwm: True
# hardware_pwm: True
prep: ^!MCB_V3:TRG3
load: ^MCB_V3:EXT3

[tmc2209 AFC_stepper lane3]
uart_pin: MCB_V3:M3_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_stepper lane4]
unit: MCB_V3:4
step_pin: MCB_V3:M4_STEP
dir_pin: MCB_V3:M4_DIR
enable_pin: !MCB_V3:M4_EN
microsteps: 16
rotation_distance: 7.905
dist_hub: 435
park_dist: 10
led_index: AFC_Indicator:1
# afc_motor_rwd: MCB_V3:MOT4_RWD
# afc_motor_fwd: MCB_V3:MOT4_FWD
# afc_motor_enb: MCB_V3:MOT4_EN
# rwd_speed_multiplier: 0.5
# fwd_speed_multiplier: 0.5
# pwm: True
# hardware_pwm: True
prep: ^!MCB_V3:TRG4
load: ^MCB_V3:EXT4

[tmc2209 AFC_stepper lane4]
uart_pin: MCB_V3:M4_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_hub MCB_V3]
switch_pin: ^MCB_V3:HUB   # Pin for the hub switch
afc_bowden_length: 1725     # Length of the Bowden tube from the hub to the toolhead sensor in mm.
move_dis: 75                # Distance to move the filament within the hub in mm.
#hub_clear_move_dis: 65     # Distance after hub switch becomes fast to retract to insure hub is clear
cut: False                  # Hub cutter installed (e.g. Snappy)

#--=================================================================================--#
######### Hub Cut #####################################################################
#--=================================================================================--#
assisted_retract: False     # If True, retracts are assisted to prevent loose windows on the spool
cut_cmd: AFC #CMD to use
cut_dist: 50                # How much filament to cut off (in mm).
cut_clear: 120              # How far the filament should retract back from the hub (in mm).
cut_min_length: 300.0
cut_servo_pass_angle: 10    # Servo angle to align the Bowden tube with the hole for loading the toolhead.
cut_servo_clip_angle: 180   # Servo angle for cutting the filament.
cut_servo_prep_angle: 80    # Servo angle to prepare the filament for cutting (aligning the exit hole).

#[AFC_screen MCB_V3]
#mac_address: None

[AFC_led AFC_Indicator]
pin: MCB_V3:RGB1
chain_count: 4
color_order: GRB

#[neopixel Extra2]
#pin: MCB_V3:RGB2
#chain_count: 6
#color_order: GRB

#[neopixel Extra3]
#pin: MCB_V3:RGB3
#chain_count: 6
#color_order: GRB

#[neopixel Extra4]
#pin: MCB_V3:RGB4
#chain_count: 4
#color_order: GRB

[AFC_buffer MCB_V3]
advance_pin: ^MCB_V3:TN_ADV    # set advance pin
trailing_pin: ^MCB_V3:TN_TRL  # set trailing pin
multiplier_high: 1.05   # default 1.05, factor to feed more filament
multiplier_low:  0.95   # default 0.95, factor to feed less filament
